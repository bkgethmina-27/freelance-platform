<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NextMarket</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="main-container">
        <div class="form-card">
            <h2>Welcome Back</h2>
            <p style="margin-bottom: 1.5rem; color: #64748b;">Log in to access your account dashboard.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
            </form>
            <p id="msg" style="margin-top: 1rem; font-weight: 600; text-align: center;"></p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">&copy; 2026 NextMarket Freelance Engine. All rights reserved.</div>
    </footer>

    <script src="/static/navbar.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            const msg = document.getElementById('msg');
            if(res.ok) {
                msg.style.color = '#10b981';
                msg.innerText = "Logged in successfully! Redirecting...";
                setTimeout(() => window.location.href = '/index.html', 1000);
            } else {
                msg.style.color = '#ef4444';
                msg.innerText = data.error;
            }
        });
    </script>
</body>
</html>
