<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | NextMarket</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-container">
    <h2>Join NextMarket</h2>
    <p>Create your account to post services or hire talent instantly.</p>
    
    <div id="error-alert" class="alert alert-danger" style="display:none;"></div>

    <form id="register-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="full_name" required placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <div class="form-group">
        <label>WhatsApp Number</label>
        <input type="text" id="whatsapp_number" placeholder="+1234567890">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="/login.html">Log In</a></p>
  </div>

  <script src="/static/navbar.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorAlert = document.getElementById('error-alert');
      errorAlert.style.display = 'none';

      const payload = {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        whatsapp_number: document.getElementById('whatsapp_number').value
      };

      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (res.ok) {
        window.location.href = '/login.html';
      } else {
        errorAlert.textContent = data.error || 'Registration failed';
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
