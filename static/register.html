<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | NextMarket</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body style="background-color: #f8fafc; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif;">
  <div id="navbar-container"></div>

  <div style="max-width: 460px; margin: 3rem auto; background: #ffffff; padding: 2.5rem; border-radius: 0.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
    <h2 style="margin: 0 0 0.5rem 0; font-size: 1.5rem; color: #0f172a;">Join NextMarket</h2>
    <p style="margin: 0 0 1.5rem 0; color: #64748b; font-size: 0.95rem;">Create your account to post services or hire talent instantly.</p>
    
    <div id="error-alert" style="display:none; padding: 0.75rem; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 0.375rem; font-size: 0.875rem; margin-bottom: 1rem;"></div>

    <form id="register-form">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.375rem; font-size: 0.875rem; color: #334155;">Full Name</label>
        <input type="text" id="full_name" required placeholder="John Doe" style="width: 100%; padding: 0.625rem 0.875rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.95rem; box-sizing: border-color 0.2s;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.375rem; font-size: 0.875rem; color: #334155;">Email Address</label>
        <input type="email" id="email" required placeholder="john@example.com" style="width: 100%; padding: 0.625rem 0.875rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.375rem; font-size: 0.875rem; color: #334155;">Password</label>
        <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding: 0.625rem 0.875rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.375rem; font-size: 0.875rem; color: #334155;">WhatsApp Number</label>
        <input type="text" id="whatsapp_number" placeholder="+1234567890" style="width: 100%; padding: 0.625rem 0.875rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.95rem;">
      </div>

      <button type="submit" style="width: 100%; padding: 0.75rem; background-color: #2563eb; color: #ffffff; border: none; border-radius: 0.375rem; font-weight: 700; font-size: 1rem; cursor: pointer;">Create Account</button>
    </form>

    <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: #64748b;">
      Already have an account? <a href="/login.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">Log In</a>
    </p>
  </div>

  <script src="/static/navbar.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorAlert = document.getElementById('error-alert');
      errorAlert.style.display = 'none';

      const payload = {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        whatsapp_number: document.getElementById('whatsapp_number').value
      };

      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (res.ok) {
        window.location.href = '/login.html';
      } else {
        errorAlert.textContent = data.error || 'Registration failed';
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
