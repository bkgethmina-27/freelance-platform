<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Gigs | NextMarket</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="main-container">
        <div class="form-card">
            <h2>Create New Service Gig</h2>
            <p style="margin-bottom: 1.5rem; color: #64748b;">Post a service offering. Pricing must strictly respect your current experience Tier Floor. Posting your first gig activates your freelancer profile.</p>

            <form id="gigForm">
                <div class="form-group">
                    <label for="gigCategory">Category</label>
                    <select id="gigCategory" required>
                        <option value="">Loading categories...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="gigTitle">Service Title</label>
                    <input type="text" id="gigTitle" placeholder="e.g. Full-Stack Python Flask Web App Development" required>
                </div>
                <div class="form-group">
                    <label for="gigPrice">Proposed Price ($ USD)</label>
                    <input type="number" step="0.01" id="gigPrice" placeholder="25.00" required>
                    <p id="floorHint" style="margin: 0.375rem 0 0 0; font-size: 0.8rem; color: #94a3b8;"></p>
                </div>
                <button type="submit" class="btn-submit">Publish Gig</button>
            </form>

            <p id="msg" style="margin-top: 1rem; font-weight: 600; text-align: center;"></p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">&copy; 2026 NextMarket Freelance Engine. All rights reserved.</div>
    </footer>

    <script src="/static/navbar.js"></script>
    <script>
        let categories = [];
        let myTier = 1;

        const TIER_MULTIPLIERS = { 1: 1.0, 2: 2.5, 3: 5.0 };

        function updateFloorHint() {
            const catId = document.getElementById('gigCategory').value;
            const hint = document.getElementById('floorHint');
            const cat = categories.find(c => String(c.id) === String(catId));
            if (!cat) { hint.innerText = ''; return; }
            const floor = cat.base_price * (TIER_MULTIPLIERS[myTier] || 1);
            hint.innerText = `Minimum price for this category at your Tier ${myTier}: $${floor.toFixed(2)}`;
        }

        (async () => {
            try {
                const meRes = await fetch('/api/auth/me');
                if (meRes.ok) {
                    const me = await meRes.json();
                    myTier = me.current_tier || 1;
                }
            } catch (err) {}

            const select = document.getElementById('gigCategory');
            try {
                const res = await fetch('/api/categories');
                categories = await res.json();
                select.innerHTML = '<option value="">Select a category</option>' +
                    categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (err) {
                select.innerHTML = '<option value="">Could not load categories</option>';
            }
            select.addEventListener('change', updateFloorHint);
        })();

        document.getElementById('gigForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('gigTitle').value;
            const price = document.getElementById('gigPrice').value;
            const category_id = document.getElementById('gigCategory').value;

            const res = await fetch('/api/gigs/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title, price: price, category_id: category_id })
            });

            const data = await res.json();
            const msg = document.getElementById('msg');

            if(res.ok) {
                msg.style.color = '#10b981';
                msg.innerText = `${data.message} (Tier ${data.tier} Rate: $${data.price})`;
                document.getElementById('gigForm').reset();
                if (data.became_freelancer) {
                    localStorage.setItem('nm_mode', 'freelancer');
                }
            } else {
                msg.style.color = '#ef4444';
                msg.innerText = `Rejected: ${data.message}`;
            }
        });
    </script>
</body>
</html>
