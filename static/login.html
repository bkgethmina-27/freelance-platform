<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | NextMarket</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { background-color: #f8fafc; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    .card-box { max-width: 440px; margin: 4rem auto; background: #ffffff; padding: 2.5rem; border-radius: 0.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); box-sizing: border-box; }
    .input-field { width: 100%; padding: 0.625rem 0.875rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.95rem; box-sizing: border-box; margin-top: 0.375rem; }
    .btn-submit { width: 100%; padding: 0.75rem; background-color: #2563eb; color: #ffffff; border: none; border-radius: 0.375rem; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
    .btn-submit:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <div class="card-box">
    <h2 style="margin: 0 0 0.5rem 0; font-size: 1.5rem; color: #0f172a;">Welcome Back</h2>
    <p style="margin: 0 0 1.5rem 0; color: #64748b; font-size: 0.95rem;">Log in to access your account dashboard.</p>
    
    <div id="error-alert" style="display:none; padding: 0.75rem; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 0.375rem; font-size: 0.875rem; margin-bottom: 1rem;"></div>

    <form id="login-form">
      <div style="margin-bottom: 1.25rem;">
        <label style="font-weight: 600; font-size: 0.875rem; color: #334155;">Email Address</label>
        <input type="email" id="email" class="input-field" required placeholder="john@example.com">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="font-weight: 600; font-size: 0.875rem; color: #334155;">Password</label>
        <input type="password" id="password" class="input-field" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: #64748b;">
      Don't have an account? <a href="/register.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">Get Started</a>
    </p>
  </div>

  <script src="/static/navbar.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorAlert = document.getElementById('error-alert');
      errorAlert.style.display = 'none';

      const payload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (res.ok) {
        window.location.href = '/index.html';
      } else {
        errorAlert.textContent = data.error || 'Invalid credentials';
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
